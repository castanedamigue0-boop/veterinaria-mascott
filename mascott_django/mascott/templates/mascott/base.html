{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block titulo %}Veterinaria Mascott{% endblock %}</title>
  <link rel="icon" href="{% static 'mascott/imagenes/logo.png' %}"/>
  {% block estilos %}{% endblock %}
  <style>
    .django-messages {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .django-msg {
      color: #fff;
      padding: .75rem 1.25rem;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      max-width: 320px;
    }
    .django-msg.error   { background: #c62828; }
    .django-msg.success { background: #2e7d32; }
    .django-msg.warning { background: #e65100; }
    .django-msg.info    { background: #1565c0; }
  </style>
</head>
<body>

{% if messages %}
  <div class="django-messages" role="alert" aria-live="polite">
    {% for msg in messages %}
      <div class="django-msg {{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
  </div>
  <script>
    setTimeout(function() {
      document.querySelectorAll('.django-messages .django-msg').forEach(function(el) {
        el.style.transition = 'opacity .4s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 400);
      });
    }, 4000);
  </script>
{% endif %}

{% block contenido %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
