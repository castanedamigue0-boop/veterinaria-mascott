{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block titulo %}Veterinaria Mascott{% endblock %}</title>
  <link rel="icon" href="{% static 'mascott/imagenes/logo.png' %}"/>
  {% block estilos %}{% endblock %}
</head>
<body>

{% if messages %}
  <div class="django-messages" style="position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem">
    {% for msg in messages %}
      <div style="background:{% if msg.tags == 'error' %}#c62828{% else %}#2e7d32{% endif %};
                  color:#fff;padding:.75rem 1.25rem;border-radius:12px;
                  font-size:.9rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);
                  max-width:320px">
        {{ msg }}
      </div>
    {% endfor %}
  </div>
  <script>
    setTimeout(()=>{
      document.querySelectorAll('.django-messages > div').forEach(el => el.remove());
    }, 4000);
  </script>
{% endif %}

{% block contenido %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
