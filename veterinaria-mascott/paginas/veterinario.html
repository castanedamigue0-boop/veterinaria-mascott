<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Admin · Clínica Veterinaria Mascott</title>
  <meta name="robots" content="noindex"/>
  <link rel="manifest" href="../configuracion/manifest.json"/>
  <meta name="theme-color" content="#1565c0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="apple-touch-icon" href="../imagenes/logo.png"/>
  <link rel="icon" href="../imagenes/logo.png"/>
  <link rel="stylesheet" href="../estilos/panel-administrador.css"/>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>emailjs.init('39GZ6Xz3ILF7VvX2B');</script>
</head>
<body>

  <!-- LOGIN ADMIN -->
  <div class="Veterinario" id="vetrinarioLoginWrap">
    <div class="admin-login-card">
      <div class="veterinario-login-logo">
        <img src="../imagenes/logo.png" alt="Mascott" class="veterinario-logo-img"/>
        <span>Mascott</span>
      </div>
      <h2>Panel Veterinario</h2>
      <p>Acceso exclusivo para personal autorizado</p>
      <form id="veterinaioLoginForm" novalidate>
        <div class="form-group">
          <label for="a-user">Usuario</label>
          <input type="text" id="a-user" placeholder="veterinarios" required autocomplete="username"/>
          <span class="field-error" id="ae-user" role="alert"></span>
        </div>
        <div class="form-group">
          <label for="a-pass">Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="a-pass" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" class="toggle-pass" data-target="a-pass" aria-label="Mostrar">👁</button>
          </div>
          <span class="field-error" id="ae-pass" role="alert"></span>
        </div>
        <button type="submit" class="btn-admin-login">🔓 Acceder al Panel</button>
        <div class="form-msg" id="veteinario-login-msg" role="status" aria-live="polite"></div>
      </form>
      <a href="inicio.html" class="back-link">← Volver al sitio</a>
    </div>
  </div>

  <!-- PANEL VETERINARIO --> 
  <div class="Veterinario" id="Veterinario" style="display:none">

   

    <!-- TOPBAR MÓVIL -->
    <header class="veterinario-topbar">
      <button class="veterinario-menu-btn" id="veterinarioMenuBtn" aria-label="Menú">☰</button>
      <span>🔐 veterinario Mascott</span>
      <button class="as-logout-top" id="btnAdminLogoutTop">🚪</button>
    </header>

    <div class="veterinario-overlay" id="adminOverlay"></div>

    <!-- MAIN -->
    <main class="admin-main">

      <!-- DASHBOARD -->
      <section class="admin-section active" id="sec-dashboard">
        <h2 class="admin-title">📊 Dashboard</h2>
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-grid">
          <div class="admin-card">
            <h3>📅 Citas pendientes</h3>
            <div id="dashCitasPendientes"></div>
          </div>
          <div class="admin-card">
            <h3>👥 Últimos clientes</h3>
            <div id="dashUltimosClientes"></div>
          </div>
        </div>
      </section>

      <!-- CITAS -->
      <section class="admin-section" id="sec-citas" hidden>
        <div class="admin-section-header">
          <h2 class="admin-title">📅 Gestión de Citas</h2>
          <div class="citas-filtros">
           
          </div>
        </div>
        <div id="adminCitasList" class="admin-citas-list"></div>
      </section>

      <!-- CLIENTES -->
      <section class="admin-section" id="sec-clientes" hidden>
        <h2 class="admin-title">👥 Clientes Registrados</h2>
        <div class="admin-search-wrap">
          <input type="search" id="clienteSearch" placeholder="🔍 Buscar cliente..." aria-label="Buscar cliente"/>
        </div>
        <div id="clientesList" class="clientes-grid"></div>
      </section>
