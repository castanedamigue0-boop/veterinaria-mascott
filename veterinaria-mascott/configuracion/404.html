<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada · Mascott</title>
  <link rel="stylesheet" href="inicio.css"/>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a2e6e 0%, #1565c0 100%); margin: 0; font-family: inherit; }
    .err-wrap { text-align: center; color: #fff; padding: 2rem; }
    .err-num { font-size: 8rem; font-weight: 900; line-height: 1; opacity: .15; letter-spacing: -4px; }
    .err-emoji { font-size: 5rem; display: block; margin: -2rem 0 1rem; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .err-title { font-size: 1.8rem; font-weight: 800; margin-bottom: .5rem; }
    .err-sub { color: rgba(255,255,255,.65); margin-bottom: 2rem; font-size: 1rem; }
    .err-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-home { background: #fff; color: #0d47a1; padding: .75rem 1.75rem; border-radius: 50px; font-weight: 700; text-decoration: none; font-size: .95rem; transition: transform .2s; }
    .btn-home:hover { transform: translateY(-2px); }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; padding: .75rem 1.75rem; border-radius: 50px; font-weight: 700; text-decoration: none; font-size: .95rem; border: 2px solid rgba(255,255,255,.3); transition: background .2s; }
    .btn-back:hover { background: rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-num">404</div>
    <span class="err-emoji">🐾</span>
    <h1 class="err-title">¡Ups! Página no encontrada</h1>
    <p class="err-sub">Parece que esta página se fue a pasear con su mascota.<br/>No te preocupes, te ayudamos a volver.</p>
    <div class="err-btns">
      <a href="inicio.html" class="btn-home">🏠 Ir al inicio</a>
      <a href="javascript:history.back()" class="btn-back">← Volver atrás</a>
    </div>
  </div>
</body>
</html>
